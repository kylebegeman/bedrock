<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" width="88" height="88" role="img" aria-label="Bedrock">
  <defs>
    <clipPath id="r"><rect x="4" y="4" width="80" height="80" rx="18"/></clipPath>
  </defs>
  <rect x="4" y="4" width="80" height="80" rx="18" fill="#7c4a21"/>
  <g clip-path="url(#r)">
    <!-- loose surface material, lightest -->
    <path d="M4 4h80v22c-13 5-24-3-38 1S17 33 4 28Z" fill="#d9a066"/>
    <!-- upper strata -->
    <path d="M4 28c13 5 24-1 38-5s25 4 38-1v20c-12 6-25-2-39 2S16 50 4 45Z" fill="#b97a3d"/>
    <!-- lower strata -->
    <path d="M4 45c12 5 23-1 37-5s27 4 39-2v19c-13 6-26-2-40 1S16 62 4 58Z" fill="#8f5a2b"/>
    <!-- bedrock, the solid layer everything rests on -->
