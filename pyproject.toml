[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ophelia"
version = "0.6.18"
description = "Fixture-first deployment control plane for VPS apps and agent-readable operations"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["deployment", "vps", "operations", "infrastructure", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["jsonschema>=4"]

[project.scripts]
ship = "ophelia.main:main"
ophelia = "ophelia.main:main"
opheliad = "ophelia.daemon.main:main"

[project.urls]
Repository = "https://github.com/kylebegeman/ophelia"
Issues = "https://github.com/kylebegeman/ophelia/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ophelia.resources" = ["templates/**/*.tpl", "systemd/*.service", "systemd/*.py", "edge/**/*.yml", "edge/**/Caddyfile"]
